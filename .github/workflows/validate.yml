name: Offline validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record runtime
        run: python3 --version
      - name: Check deterministic output
        run: python3 scripts/generate_site.py --check
      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate repository and feed
        run: python3 scripts/validate_repo.py
      - name: Audit genuine candidate history
        env:
          AUDIT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/audit_history.py --revision "$AUDIT_REVISION"
      - name: Check patch hygiene and clean generation
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1)"
